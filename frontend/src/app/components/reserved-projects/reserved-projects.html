<div class="d-flex justify-content-center">
    <div class="card w-75 m-3 p-3">
        <div class="mb-2">
            <h1>I tuoi progetti</h1>
        </div>
        <div class="list-container">
            <table class="table" >
                <thead class="table-dark" >
                    <tr class="">
                        <th>ID</th>
                        <th>Titolo</th>
                        <th>Creato il</th>
                        <th>Descrizione</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody class="">
                    @for (project of projects; track $index) {
                        <tr class="">
                            <td class="p-3">{{project.id}}</td>
                            <td class="p-3">{{project.title}}</td>
                            <td class="p-3">{{ project.createdAt | date:'dd/MM/yyyy' }}</td>
                            <td class="p-3">{{project.description}}</td>
                            <td class="p-3">
                                <i (click)="managePhotos(project)" class="action-icon fa-solid fa-image"></i>
                                <i (click)="editProject(project)" class="action-icon fa-solid fa-pen"></i>
                                <i (click)="deleteProject(project)" class="action-icon fa-solid fa-trash"></i>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
            <button class="btn btn-success p-2 m-3 float-end" (click)="createNewProject()">Crea un nuovo progetto</button>
        </div>
    </div>
</div>
