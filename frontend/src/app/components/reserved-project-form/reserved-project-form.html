<div class="container ">
    <div class="d-flex">
        <h1>Progetto {{project.title}} </h1>
    </div>
    <div class="card p-3">
        <form>
            <div class="row g-3">
                <div class="col-4">
                    <label for="titolo-progetto" class="form-label">Titolo</label>
                    <input 
                        [(ngModel)]="project.title"
                        type="text" 
                        class="form-control" 
                        id="titolo-progetto" 
                        name="titolo-progetto">
                </div>
                <div class="col-4">
                    <label for="descrizione-progetto" class="form-label">Descrizione</label>
                    <textarea 
                        [(ngModel)]="project.description"
                        type="text" 
                        class="form-control" 
                        id="descrizione-progetto" 
                        name="descrizione-progetto"></textarea>
                </div>
            </div>
            <!-- <div class="row g-3 mt-3">
                <label for="foto-progetto" class="form-label">Seleziona le foto</label>
                <input 
                    id="foto-progetto" 
                    name="foto-progetto" 
                    class="form-control col-12" 
                    type="file">
            </div> -->

            <div class="p-3">
                <button type="button" (click)="logProgetto()" class="btn btn-success" >submit</button>
            </div>
        </form>
    </div>
</div>
